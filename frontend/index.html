<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>buyted - プレイヤー主導フリマ</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #f4f4f4; color: #333; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        h1 { color: #007bff; text-align: center; }
        input { padding: 10px; margin: 5px 0; width: calc(100% - 22px); border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background: #0056b3; }
        .request-card { border-bottom: 1px solid #eee; padding: 15px 0; }
        .request-card:last-child { border-bottom: none; }
        .price { color: #e44d26; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>buyted</h1>
        <p>欲しいカードをリクエストして、出品者を待とう</p>
        
        <div>
            <input type="text" id="cardName" placeholder="例：青眼の白龍 (アルティメット)">
            <input type="number" id="price" placeholder="希望価格（例：12000）">
            <button onclick="sendRequest()">リクエストを投稿する</button>
        </div>

        <hr style="margin: 30px 0;">
        
        <div id="requestList">
            </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
