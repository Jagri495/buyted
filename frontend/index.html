<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>buyted - プレイヤー主導フリマ</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #f4f4f4; color: #333; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 700px; margin: auto; }
        h1 { color: #007bff; text-align: center; }
        .section { margin-bottom: 30px; border-bottom: 2px solid #f4f4f4; padding-bottom: 20px; }
        input, textarea { padding: 10px; margin: 5px 0; width: calc(100% - 22px); border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button.offer-btn { background: #28a745; margin-top: 10px; }
        .request-card { background: #fff; border: 1px solid #ddd; padding: 15px; margin-top: 10px; border-radius: 8px; }
        .price { color: #e44d26; font-weight: bold; }
        .offer-box { background: #f9f9f9; border-left: 4px solid #28a745; padding: 10px; margin-top: 10px; font-size: 0.9em; }
        .modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 10% auto; padding: 20px; width: 50%; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>buyted</h1>

        <div class="section">
            <h3>カードをリクエストする</h3>
            <input type="text" id="cardName" placeholder="カード名">
            <input type="number" id="price" placeholder="希望価格">
            <button onclick="sendRequest()">リクエストを投稿</button>
        </div>

        <div id="requestList">
            <h3>募集中リクエスト</h3>
            </div>
    </div>

    <div id="offerModal" class="modal">
        <div class="modal-content">
            <h3>このリクエストに提案する</h3>
            <p id="modalTargetCard"></p>
            <input type="number" id="offerPrice" placeholder="提案価格">
            <input type="text" id="offerImage" placeholder="写真URL（現在はダミーURLでOK）">
            <textarea id="offerComment" placeholder="状態の補足説明（右下に微傷あり、など）"></textarea>
            <button onclick="submitOffer()">提案を送信する</button>
            <button onclick="closeModal()" style="background:#666;">キャンセル</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
